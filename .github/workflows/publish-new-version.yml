name: Publish New Version

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        type: choice
        description: "Type of version bump to perform"
        options:
          - patch
          - minor
          - major
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pre_release_check:
    permissions:
      contents: read
    name: Pre release check
    runs-on: ubuntu-24.04
    environment: 'publish'
    steps:
      - name: Check
        id: pre_release_check_step
        run: echo "Pre release check"
  publish:
    permissions:
      contents: write
    needs: pre_release_check
    uses: GetStream/stream-build-conventions-android/.github/workflows/release.yml@161dace284ff29473ea607bf26f436f6bb46c057
    with:
      bump: ${{ inputs.bump }}
      publish-targets: streamRepo
    secrets:
      github-token: ${{ secrets.STREAM_PUBLIC_BOT_TOKEN }}
      maven-central-username: ${{ secrets.OSSRH_USERNAME }}
      maven-central-password: ${{ secrets.OSSRH_PASSWORD }}
      signing-key: ${{ secrets.SIGNING_KEY }}
      signing-key-id: ${{ secrets.SIGNING_KEY_ID }}
      signing-key-password: ${{ secrets.SIGNING_PASSWORD }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_ANDROID_CICD }}
      stream-repo-endpoint: ${{ secrets.STREAM_REPO_ENDPOINT }}
      stream-repo-bucket: ${{ secrets.STREAM_REPO_BUCKET }}
      stream-repo-access-key-id: ${{ secrets.STREAM_REPO_ACCESS_KEY_ID }}
      stream-repo-secret-access-key: ${{ secrets.STREAM_REPO_SECRET_ACCESS_KEY }}
