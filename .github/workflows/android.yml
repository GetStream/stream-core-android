name: Android CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    permissions:
      contents: read
      pull-requests: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/android-ci.yml@178f8ddfa4c28ba19ba66c1c54f9091b00ef6c40 # v1.5.0
    secrets:
      BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
      BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
      BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
      BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
      # SonarCloud can't read pull requests from GitHub, so the shared workflow skips Sonar on them without a token.
      SONAR_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SONAR_TOKEN || '' }}
    with:
      api-check: true
